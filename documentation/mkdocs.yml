site_name: DataMgmt Node
site_description: Decentralized enterprise data sharing over EVM chains and the Gun P2P network.
site_author: Cryptuon Research
site_url: https://docs.cryptuon.com/datamgmtnode/
copyright: "© 2026 Cryptuon Research"

repo_name: cryptuon/datamgmtnode
repo_url: https://github.com/cryptuon/datamgmtnode
edit_uri: edit/main/documentation/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Docs:
    - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
    - User Guide:
      - Overview: user-guide/overview.md
      - Web Dashboard: user-guide/web-dashboard.md
      - Terminal UI: user-guide/terminal-ui.md
      - Data Sharing: user-guide/data-sharing.md
      - API Reference: user-guide/api-reference.md
      - P2P Network: user-guide/p2p-network.md
  - Operations:
    - Deployment: operations/deployment.md
    - Monitoring: operations/monitoring.md
    - Performance: operations/performance.md
    - Security: operations/security.md
    - Troubleshooting: operations/troubleshooting.md
  - Project:
    - Development:
      - Architecture: development/architecture.md
      - Plugin Development: development/plugins.md
      - Smart Contracts: development/smart-contracts.md
      - Testing: development/testing.md
  # Removed "Contributing" — no CONTRIBUTING.md / contributor guide exists in repo;
  # standard PR flow only. Tooling claims (flake8/mypy/pre-commit) were not configured.

extra:
  homepage: https://datamgmtnode.cryptuon.com/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cryptuon
    - icon: material/web
      link: https://datamgmtnode.cryptuon.com/
